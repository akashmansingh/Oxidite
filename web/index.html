<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oxidite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@75..150,300..900&family=Sometype+Mono:wght@400..700&display=swap">
</head>
<body>
<div id="app">
  <header>
    <h1>oxidite</h1>
    <div id="chain" data-a="retry" data-b="ok" role="status" aria-live="polite">
      <span class="node">you</span><i class="link a"></i>
      <span class="node">gateway</span><i class="link b"></i>
      <span class="node" id="node-t">local shell</span>
    </div>
  </header>
  <nav id="rail" aria-label="Sessions">
    <button id="new" class="btn" type="button">New session</button>
    <div id="cores"></div>
    <p id="empty">No sessions yet. Start one and it keeps running after you close this tab.</p>
  </nav>
  <main id="slab"><div id="term"></div></main>
  <footer><span id="msg">Not connected</span><span id="off"></span></footer>
</div>

<dialog id="gate">
  <form method="dialog">
    <h2>Unlock the gateway</h2>
    <p>Paste the access token printed when <code>oxidited</code> started.</p>
    <input id="tok" type="text" value="oxidite-secret" autocomplete="off" required aria-label="Access token">
    <div class="row"><button class="btn" value="go">Unlock</button></div>
  </form>
</dialog>

<dialog id="newdlg">
  <form method="dialog">
    <h2>New session</h2>
    <label class="pick"><input type="radio" name="kind" value="local" id="k-local" checked> Shell on the gateway</label>
    <label class="pick"><input type="radio" name="kind" value="ssh" id="k-ssh"> Remote host over SSH</label>
    <fieldset id="ssh">
      <label>Host <input name="host" autocomplete="off"></label>
      <label>Port <input name="port" type="number" value="22"></label>
      <label>User <input name="user" autocomplete="username"></label>
      <label>Password <input name="pw" type="password" autocomplete="current-password"></label>
      <label class="pick"><input type="checkbox" name="tmux" checked> Keep the shell alive if the connection drops (needs tmux on the host)</label>
    </fieldset>
    <div class="row"><button class="btn alt" value="no">Cancel</button><button class="btn" value="go">Start session</button></div>
  </form>
</dialog>

<dialog id="prompt"><form method="dialog"><h2></h2><div id="pbody"></div><div class="row" id="pbtns"></div></form></dialog>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
