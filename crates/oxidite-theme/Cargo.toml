[package]
name = "oxidite-theme"
version = "0.1.0"
edition = "2024"
description = "Theme structs and built-in presets for Oxidite"
license = "MIT"

[dependencies]
glyphon = { version = "0.12", optional = true }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
thiserror = "2.0"

[features]
default = ["glyphon"]
glyphon = ["dep:glyphon"]

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
