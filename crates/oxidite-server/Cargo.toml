[package]
name = "oxidite-server"
version = "0.1.0"
edition = "2024"
description = "Oxidite session server (oxidited) - Axum web server and WebSocket gateway"
license = "MIT"
default-run = "oxidited"

[[bin]]
name = "oxidited"
path = "src/main.rs"

[dependencies]
oxidite-vt = { path = "../oxidite-vt" }
oxidite-pty = { path = "../oxidite-pty" }
oxidite-theme = { path = "../oxidite-theme" }
oxidite-proto = { path = "../oxidite-proto" }
oxidite-session = { path = "../oxidite-session" }
oxidite-ssh = { path = "../oxidite-ssh" }
oxidite-directory = { path = "../oxidite-directory" }
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["ws", "macros"] }
tower = { version = "0.5", features = ["util", "timeout", "limit"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
argon2 = "0.5"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-pki-types = "1.16"
anyhow = "1.0"
thiserror = "2.0"
bytes = "1.7"
rand = "0.8"
futures-util = "0.3"
mime_guess = "2.0"

[dev-dependencies]
tokio-tungstenite = "0.24"
