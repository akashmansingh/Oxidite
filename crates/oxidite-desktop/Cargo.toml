[package]
name = "oxidite-desktop"
version = "0.1.0"
edition = "2024"
description = "Frozen native desktop GPU terminal emulator for Oxidite"
license = "MIT"
default-run = "oxidite"

[[bin]]
name = "oxidite"
path = "src/main.rs"

[dependencies]
oxidite-vt = { path = "../oxidite-vt" }
oxidite-pty = { path = "../oxidite-pty" }
oxidite-theme = { path = "../oxidite-theme" }

anyhow = "1.0"
bitflags = "2.8"
portable-pty = "0.9"
regex = "1.13"
thiserror = "2.0"
unicode-width = "0.2"
vte = "0.15"
glyphon = "0.12"
pollster = "1.0"
wgpu = "30.0"
winit = "0.30"
arboard = "3.4"
dirs = "6.0"
env_logger = "0.11"
log = "0.4"
notify = "8.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
