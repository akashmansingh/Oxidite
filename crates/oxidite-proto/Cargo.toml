[package]
name = "oxidite-proto"
version = "0.1.0"
edition = "2024"
description = "Wire protocol types, serialization, and framing for Oxidite"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
rmp-serde = "1.3"
uuid = { version = "1.10", features = ["v4", "serde"] }
thiserror = "2.0"
bytes = "1.7"

[dev-dependencies]
serde_json = "1.0"
