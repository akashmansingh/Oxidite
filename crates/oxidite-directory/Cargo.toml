[package]
name = "oxidite-directory"
version = "0.1.0"
edition = "2024"
description = "Session directory, leases, and fencing tokens for Oxidite"
license = "MIT"

[dependencies]
oxidite-proto = { path = "../oxidite-proto" }
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
uuid = { version = "1.10", features = ["v4", "serde"] }
thiserror = "2.0"
tracing = "0.1"
parking_lot = "0.12"
