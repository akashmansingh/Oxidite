[package]
name = "oxidite-ssh"
version = "0.1.0"
edition = "2024"
description = "SSH backend, connection pooling, keepalives, and tmux persistence for Oxidite"
license = "MIT"

[dependencies]
oxidite-proto = { path = "../oxidite-proto" }
oxidite-session = { path = "../oxidite-session" }
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
thiserror = "2.0"
tracing = "0.1"
uuid = { version = "1.10", features = ["v4", "serde"] }
parking_lot = "0.12"
russh = { version = "0.65.4", default-features = false, features = ["ring", "flate2", "rsa"] }

[[test]]
name = "connection_drop"
path = "../../tests/chaos/connection_drop.rs"
